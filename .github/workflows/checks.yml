name: Laboratory 3 checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-validation.txt
      - run: python -m pip install -r requirements.txt -r requirements-validation.txt
      - run: python tools/init_env.py
      - run: python manage.py check
      - run: python manage.py test tests --settings=app.config.test_settings
      - run: python tools/check_contract.py
      - run: python tools/check_docs.py
      - run: git diff --check
