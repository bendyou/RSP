        created_at:
          type: string
          format: date-time
      required:
      - id
      - type
      - type_display
      - amount
      - description
      - created_at
    AIMessage:
      type: object
      properties:
        role:
          type: string
          enum:
          - user
          - assistant
        content:
          type: string
          minLength: 1
          maxLength: 12000
      required:
      - role
      - content
    AIRequest:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AIMessage'
          minItems: 1
          maxItems: 40
        serverId:
          type: integer
          format: int64
          minimum: 1
        serverType:
          type: string
          enum:
          - ssh
          - allocated
      required:
      - messages
      description: serverId/serverType принимаются для совместимости клиента, но исходный ai_chat не использует
        их для чтения сервера и не запускает команды.
    AIResponse:
      type: object
      properties:
        success:
          type: boolean
        response:
          type: string
      required:
      - success
      - response
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - pass
        app_name:
          type: string
        version:
          type: string
        environment:
          type: string
        uptime_seconds:
          type: integer
          format: int64
          minimum: 0
      required:
      - status
      - app_name
      - version
      - environment
      - uptime_seconds
      example:
        status: pass
        app_name: CommandX
        version: 1.0.0
        environment: development
        uptime_seconds: 0
    ErrorResponse:
      type: object
      minProperties: 1
      additionalProperties: true
      description: 'Общая совместимая схема JSON-ошибок: DRF detail/code, собственные error/message/success и словари
        ошибок полей. Не вводит выдуманный единый envelope.'
      properties:
        detail:
          type: string
        code:
          type: string
        error:
          type: string
        message:
          type: string
        success:
          type: boolean
        details:
          type: string
          nullable: true
      example:
        detail: Учетные данные не были предоставлены.
    AdminUserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        username:
          type: string
        email:
          type: string
        date_joined:
          type: string
          format: date-time
          nullable: true
        avatar:
          type: string
          nullable: true
        email_verified:
          type: boolean
        balance:
          type: number
          format: double
          description: 'Совместимость с исходником: JSON number из float(Decimal), в БД numeric(10,2).'
        is_staff:
          type: boolean
        subscription_type:
          type: string
          enum:
          - none
          - pro
          - plus
        subscription_expires_at:
          type: string
          format: date-time
          nullable: true
        has_active_subscription:
          type: boolean
        is_active:
          type: boolean
      required:
      - id
      - username
      - email
      - date_joined
      - avatar
      - email_verified
      - balance
      - is_staff
      - subscription_type
      - subscription_expires_at
      - has_active_subscription
      - is_active
