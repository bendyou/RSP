components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 150
        email:
          type: string
          description: 'Проверка исходника: непустой email с @ и точкой после @; дополнительно проверяется существование.'
        password:
          type: string
          minLength: 8
          writeOnly: true
        password_confirm:
          type: string
          minLength: 1
          writeOnly: true
          description: Должен совпадать с password; сравнивает приложение.
      required:
      - username
      - email
      - password
      - password_confirm
      example:
        username: student
        email: student@example.com
        password: Example-pass-2026!
        password_confirm: Example-pass-2026!
    RegisterResponse:
      type: object
      properties:
        message:
          type: string
        username:
          type: string
        email:
          type: string
        access:
          type: string
        refresh:
          type: string
      required:
      - message
      - username
      - email
      - access
      - refresh
    TokenRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          writeOnly: true
      required:
      - username
      - password
    TokenPairResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    RefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
          writeOnly: true
      required:
      - refresh
    AccessResponse:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    ProfileResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        username:
          type: string
        email:
          type: string
        date_joined:
          type: string
          format: date-time
          nullable: true
        avatar:
          type: string
          nullable: true
        email_verified:
          type: boolean
        balance:
          type: number
          format: double
          description: 'Совместимость с исходником: JSON number из float(Decimal), в БД numeric(10,2).'
        is_staff:
          type: boolean
        subscription_type:
          type: string
          enum:
          - none
          - pro
          - plus
        subscription_expires_at:
          type: string
          format: date-time
          nullable: true
        has_active_subscription:
          type: boolean
      required:
      - id
      - username
      - email
      - date_joined
      - avatar
      - email_verified
      - balance
      - is_staff
      - subscription_type
      - subscription_expires_at
      - has_active_subscription
    ProfilePatchRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 150
        email:
          type: string
        avatar:
          type: string
          nullable: true
          description: 'В JSON: null или пустая строка для удаления; загрузка файла — multipart/form-data.'
      description: Исходник игнорирует часть неверных полей; схема описывает корректный клиентский запрос. Баланс
        и роль здесь не изменяются.
    CreateServerRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        host:
          type: string
          minLength: 1
          maxLength: 255
        port:
          type: integer
          format: int64
          minimum: 1
          maximum: 65535
          default: 22
        username:
          type: string
          minLength: 1
          maxLength: 120
          description: Учётная запись SSH, не username пользователя панели.
        auth_type:
          type: string
          enum:
          - password
          - private_key
          default: password
        password:
          type: string
          maxLength: 255
          writeOnly: true
          description: SSH-пароль; требуется при auth_type=password, если ещё не сохранён.
        private_key:
          type: string
          writeOnly: true
          description: Приватный SSH-ключ; обязателен при auth_type=private_key, если ещё не сохранён.
        passphrase:
          type: string
          maxLength: 255
          writeOnly: true
        is_active:
          type: boolean
          default: true
          description: Доступ в панели; не состояние питания ОС.
      required:
      - name
      - host
      - username
      anyOf:
      - properties:
          auth_type:
            type: string
            enum:
            - password
          password:
            type: string
            minLength: 1
        required:
        - password
      - properties:
          auth_type:
            type: string
            enum:
            - private_key
          private_key:
            type: string
            minLength: 1
        required:
