openapi: 3.0.3
info:
  title: CommandX API
  version: 1.0.0
  description: 'Лабораторная №2: основной срез API существующего Django/DRF-проекта CommandX. Пути /api/ и завершающие
    слеши сохранены. В учебном каркасе №3 реализован только /health/. Остальные операции описывают исходный проект
    и будущую реализацию по заданиям. Не является полной спецификацией всех legacy и файловых маршрутов. JSON-ошибки
    имеют общую совместимую схему; необработанные исключения исходного Django могут вернуть HTML 500.'
servers:
- url: http://127.0.0.1:8000/api
  description: Локальный CommandX; в lab3 работает только /health/
tags:
- name: Auth
  description: Регистрация, JWT и свой профиль
- name: Servers
  description: Собственные SSH-серверы
- name: Monitoring
  description: Метрики по запросу и история
- name: Payments
  description: Баланс и подписка, без эквайринга
- name: Admin
  description: Доступ is_staff
- name: AI
  description: Опциональный помощник
- name: Service
  description: Проверка процесса, добавлена в лабораторной №3
security:
- bearerAuth: []
paths:
  /auth/register/:
    post:
      tags:
      - Auth
      summary: Зарегистрироваться и получить JWT
      operationId: register
      description: Создаёт User и UserProfile. Дубли username/email и несовпадение паролей дают 400, не 409. Проверки
        пароля дополнены валидаторами Django; все их правила в JSON Schema не выражены.
      x-access-role: Все
      x-lab3-implemented: false
      responses:
        '201':
          description: Ресурс создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Ошибка входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Ошибка обработки; необработанное исключение Django может вернуть HTML
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      security: []
  /auth/token/:
    post:
      tags:
      - Auth
      summary: Войти по username и паролю
      operationId: obtainToken
      description: Возвращает access (1 час) и refresh (7 дней). По email вход не реализован.
      x-access-role: Все
      x-lab3-implemented: false
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          description: Ошибка входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Нет действующего JWT / неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Ошибка обработки; необработанное исключение Django может вернуть HTML
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      security: []
  /auth/token/refresh/:
    post:
      tags:
      - Auth
      summary: Обновить access по refresh
      operationId: refreshToken
      description: Обновить access по refresh
      x-access-role: Все
      x-lab3-implemented: false
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessResponse'
        '400':
          description: Ошибка входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Нет действующего JWT / неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Ошибка обработки; необработанное исключение Django может вернуть HTML
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      security: []
  /auth/profile/:
    get:
      tags:
      - Auth
      summary: Получить свой профиль
      operationId: getProfile
      description: Получить свой профиль
      x-access-role: Пользователь
      x-lab3-implemented: false
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          description: Нет действующего JWT / неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Ошибка обработки; необработанное исключение Django может вернуть HTML
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - Auth
      summary: Изменить свой профиль
      operationId: patchProfile
      description: JSON изменяет username/email и удаляет avatar через null/пустую строку. Загрузка аватара возможна
        multipart/form-data. Неверные короткие имена исходник может игнорировать; duplicate username/email — 400.
        Роль, баланс и подписку здесь менять нельзя.
      x-access-role: Пользователь
      x-lab3-implemented: false
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          description: Ошибка входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Нет действующего JWT / неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Ошибка обработки; необработанное исключение Django может вернуть HTML
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatchRequest'
          multipart/form-data:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 150
                email:
                  type: string
                avatar:
                  type: string
                  format: binary
  /servers/:
    get:
      tags:
      - Servers
      summary: Получить свои серверы постранично
      operationId: listServers
      description: Только created_by=current_user, даже для is_staff. PageNumberPagination, размер 20, порядок -created_at.
        Несуществующая/неверная страница — 404; query-поиск/фильтрация исходником не реализованы.
      x-access-role: Пользователь
      x-lab3-implemented: false
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerPageResponse'
        '401':
          description: Нет действующего JWT / неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Не найдено или чужой сервер
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Ошибка обработки; необработанное исключение Django может вернуть HTML
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          format: int64
          minimum: 1
          default: 1
    post:
      tags:
      - Servers
      summary: Добавить SSH-сервер
      operationId: createServer
      description: created_by берётся из JWT. name/host/SSH username обязательны; port=22, auth_type=password, is_active=true
        по умолчанию. При password нужны непустые реквизиты; для private_key нужен ключ. Пароль, ключ и passphrase
        write_only; сохранение карточки не доказывает доступность SSH.
      x-access-role: Пользователь
      x-lab3-implemented: false
      responses:
        '201':
          description: Ресурс создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerResponse'
        '400':
          description: Ошибка входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Нет действующего JWT / неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Ошибка обработки; необработанное исключение Django может вернуть HTML
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServerRequest'
  /servers/{id}/:
    get:
      tags:
      - Servers
      summary: Прочитать свой сервер
      operationId: getServer
      description: Объект доступен только владельцу; чужой — 404. Эти операции разрешены и для приостановленного
        сервера. Изменение/удаление закрывает сохранённое SSH-соединение; удаление каскадно удаляет метрики через
        ORM.
      x-access-role: Пользователь
      x-lab3-implemented: false
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerResponse'
        '401':
          description: Нет действующего JWT / неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Не найдено или чужой сервер
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Ошибка обработки; необработанное исключение Django может вернуть HTML
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    put:
      tags:
      - Servers
      summary: Обновить основные данные сервера
      operationId: replaceServer
      description: Объект доступен только владельцу; чужой — 404. Эти операции разрешены и для приостановленного
        сервера. Изменение/удаление закрывает сохранённое SSH-соединение; удаление каскадно удаляет метрики через
        ORM.
      x-access-role: Пользователь
      x-lab3-implemented: false
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerResponse'
        '400':
          description: Ошибка входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Нет действующего JWT / неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Не найдено или чужой сервер
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Ошибка обработки; необработанное исключение Django может вернуть HTML
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceServerRequest'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    patch:
      tags:
      - Servers
      summary: Частично изменить сервер
      operationId: patchServer
      description: Объект доступен только владельцу; чужой — 404. Эти операции разрешены и для приостановленного
        сервера. Изменение/удаление закрывает сохранённое SSH-соединение; удаление каскадно удаляет метрики через
        ORM.
      x-access-role: Пользователь
      x-lab3-implemented: false
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerResponse'
        '400':
          description: Ошибка входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Нет действующего JWT / неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Не найдено или чужой сервер
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Ошибка обработки; необработанное исключение Django может вернуть HTML
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServerRequest'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    delete:
      tags:
      - Servers
      summary: Удалить сервер
      operationId: deleteServer
      description: Объект доступен только владельцу; чужой — 404. Эти операции разрешены и для приостановленного
        сервера. Изменение/удаление закрывает сохранённое SSH-соединение; удаление каскадно удаляет метрики через
        ORM.
      x-access-role: Пользователь
      x-lab3-implemented: false
      responses:
        '204':
          description: Удалено, без тела
        '401':
          description: Нет действующего JWT / неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Не найдено или чужой сервер
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Ошибка обработки; необработанное исключение Django может вернуть HTML
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
  /servers/{id}/exec/:
    post:
      tags:
      - Servers
      summary: Выполнить SSH-команду
      operationId: executeCommand
      description: Команда исполняется с правами SSH-пользователя, не в sandbox. Ненулевой exit_code возвращается
        с HTTP 200 и success=false. Лимит ожидания 30 секунд и вывода 4 МиБ; автоматического повтора после сбоя
        нет. Приостановленный сервер — 403.
      x-access-role: Пользователь
      x-lab3-implemented: false
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '400':
          description: Ошибка входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Нет действующего JWT / неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав или доступ приостановлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Не найдено или чужой сервер
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Ошибка обработки; необработанное исключение Django может вернуть HTML
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
  /servers/{id}/test_connection/:
    post:
      tags:
      - Servers
      summary: Проверить SSH-подключение
      operationId: testConnection
      description: SSH host key должен быть заранее доверенным. Неудачная проверка может вернуть HTTP 200 с success=false;
        исключение — 500. Не путать с health-check процесса API.
      x-access-role: Пользователь
      x-lab3-implemented: false
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
        '401':
          description: Нет действующего JWT / неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав или доступ приостановлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Не найдено или чужой сервер
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Ошибка обработки; необработанное исключение Django может вернуть HTML
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
  /servers/{server_id}/toggle_status/:
    post:
      tags:
      - Servers
      summary: Переключить доступ к серверу в панели
      operationId: toggleServerAccess
      description: Меняет is_active на противоположное; повтор неидемпотентен. Не выключает ОС. Прямая view фильтрует
        created_by; может снова включить приостановленный сервер.
      x-access-role: Пользователь
      x-lab3-implemented: false
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToggleResponse'
        '401':
          description: Нет действующего JWT / неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Не найдено или чужой сервер
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Ошибка обработки; необработанное исключение Django может вернуть HTML
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: server_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
  /servers/{id}/detailed_stats/:
    get:
      tags:
      - Monitoring
      summary: Собрать текущие SSH-метрики
      operationId: getDetailedStats
      description: Переиспользует сэмпл не старше 5 секунд либо собирает SSH-метрики и пытается сохранить их. Неизвестные
        величины — null, не 0. Возможна техническая запись сэмпла при GET; бизнес-ресурсы пользователя не изменяются.
        При недоступных командах возможен 200 с null-полями и message.
      x-access-role: Пользователь
      x-lab3-implemented: false
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricResponse'
        '401':
          description: Нет действующего JWT / неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав или доступ приостановлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Не найдено или чужой сервер
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Ошибка обработки; необработанное исключение Django может вернуть HTML
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
  /servers/{id}/metrics_history/:
    get:
      tags:
      - Monitoring
      summary: Прочитать историю метрик
      operationId: getMetricsHistory
      description: Существующие сэмплы за hours; до 2000 последних, ответ по времени ASC. Сбор SSH не запускается;
        разрешено при is_active=false. Время — timestamp; сетевые поля legacy-метрик в этот ответ не входят.
      x-access-role: Пользователь
      x-lab3-implemented: false
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MetricHistoryItem'
                maxItems: 2000
        '400':
          description: Ошибка входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Нет действующего JWT / неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Не найдено или чужой сервер
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
