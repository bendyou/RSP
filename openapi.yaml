openapi: 3.0.3
info:
  title: CommandX — ЛР3
  version: 1.0.0
  description: В этой работе реализован только health-check.
externalDocs:
  description: Полный контракт из ЛР2
  url: https://github.com/bendyou/RSP/blob/lab2/openapi.yaml
servers:
  - url: http://127.0.0.1:8000
paths:
  /api/v1/health:
    get:
      summary: Проверка работы сервиса
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                required: [status, app_name, version, environment, uptime_seconds]
                properties:
                  status:
                    type: string
                    enum: [pass]
                  app_name:
                    type: string
                  version:
                    type: string
                  environment:
                    type: string
                  uptime_seconds:
                    type: integer
                    minimum: 0
